# Windows x86_64 depuis Linux (MinGW-w64), aligné sur amspirit-lite/src/x86_64-w64-mingw32.txt.
# SDL2 : paquet mingw64-SDL2 (Fedora).
[binaries]
c = 'x86_64-w64-mingw32-gcc'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = ['/usr/x86_64-w64-mingw32/sys-root/mingw/lib/pkgconfig']

[built-in options]
# pas de dépendance à libgcc_s_seh-1.dll à côté du plugin
c_link_args = ['-static-libgcc']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
