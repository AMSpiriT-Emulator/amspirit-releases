# Linux ARM 64 bits (RPi5, Cortex-A76) depuis Linux x86_64, aligné sur amspirit-lite/src/aarch64-linux-gnu.txt.
# SDL2 : libsdl2-dev:arm64 (multiarch).
[binaries]
c = 'aarch64-linux-gnu-gcc'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = ['/usr/lib/aarch64-linux-gnu/pkgconfig', '/usr/share/pkgconfig']

[built-in options]
c_args = ['-mcpu=cortex-a76']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a76'
endian = 'little'
